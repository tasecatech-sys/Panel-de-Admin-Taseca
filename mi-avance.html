<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TASECA · Mi Plan de Estudio</title>
<style>
  :root{ --lime:#C5FF3D; --bg:#07090c; --panel:#0e1319; --panel2:#141b23; --text-dim:#9ca3af; }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI',system-ui,sans-serif; color:#e5e7eb; min-height:100vh;
    background: radial-gradient(circle at 20% 0%, rgba(197,255,61,.06), transparent 40%),
      radial-gradient(circle at 90% 100%, rgba(45,212,191,.05), transparent 40%), var(--bg);
  }
  .lime{ color:var(--lime); }
  .wrap{ max-width:880px; margin:0 auto; padding:28px 16px 60px; }
  .panel{ background:var(--panel); border:1px solid rgba(197,255,61,.08); border-radius:24px; }
  .panel2{ background:var(--panel2); border-radius:16px; }
  .brand{ font-weight:800; letter-spacing:.25em; background:linear-gradient(90deg,#e8b33a,var(--lime),#2dd4bf);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .mono{ font-family:'Courier New',monospace; letter-spacing:.15em; }
  input{ color:#e5e7eb; background:var(--panel2); border:1px solid #374151; border-radius:14px; padding:14px 16px; width:100%; font-size:16px; }
  input::placeholder{ color:#6b7280; }
  .btn-lime{ background:var(--lime); color:#0a0e12; font-weight:700; border:none; border-radius:16px; padding:14px; width:100%; font-size:15px; cursor:pointer; }
  .btn-lime:hover{ background:#d6ff6b; }
  .btn-lime:disabled{ opacity:.6; cursor:default; }
  .spinner{ border:3px solid rgba(197,255,61,.15); border-top-color:var(--lime); border-radius:50%; width:20px; height:20px; animation:spin .7s linear infinite; display:inline-block; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .badge-excel{ background:rgba(34,197,94,.15); color:#4ade80; border:1px solid rgba(34,197,94,.3); padding:2px 8px; border-radius:8px; font-size:10px; }
  .badge-powerbi{ background:rgba(234,179,8,.15); color:#facc15; border:1px solid rgba(234,179,8,.3); padding:2px 8px; border-radius:8px; font-size:10px; }
  .grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px; }
  @media(max-width:700px){ .grid3{ grid-template-columns:1fr; } }
  .platcols{ display:grid; gap:16px; }
  .err{ color:#f87171; font-size:13px; margin-top:10px; }
  .ring text{ font-family:'Segoe UI',system-ui,sans-serif; }
</style>
</head>
<body>
<div class="wrap">

  <div id="loginBox" style="text-align:center;">
    <div style="margin:24px 0;">
      <svg width="90" height="90" viewBox="0 0 100 100" style="filter:drop-shadow(0 0 8px rgba(197,255,61,.4));">
        <polygon points="50,12 88,80 12,80" fill="none" stroke="var(--lime)" stroke-width="2.5"/>
        <polygon points="50,24 78,74 22,74" fill="none" stroke="var(--lime)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/>
        <ellipse cx="50" cy="52" rx="18" ry="10" fill="none" stroke="#e8b33a" stroke-width="2"/>
        <circle cx="50" cy="52" r="5.5" fill="#e8b33a"/><circle cx="50" cy="52" r="2.2" fill="#07090c"/>
        <rect x="40" y="64" width="3" height="6" fill="#2dd4bf"/><rect x="46" y="60" width="3" height="10" fill="#e8b33a"/>
        <rect x="52" y="62" width="3" height="8" fill="#e8b33a"/><rect x="58" y="66" width="3" height="4" fill="#2dd4bf"/>
      </svg>
      <div class="mono" style="font-size:11px;color:#5eead4b0;margin-bottom:8px;">· SYSTEM ONLINE · ANALYTICS ENGINE v3.0 ·</div>
      <h1 class="brand" style="font-size:2.6rem;margin:0 0 8px;">TASECA</h1>
      <div class="mono" style="font-size:11px;color:#6b7280;">&lt; MI PLAN DE ESTUDIO · SEGUIMIENTO DE AVANCE /&gt;</div>
    </div>

    <div class="panel" style="padding:32px;max-width:420px;margin:0 auto;text-align:left;">
      <h2 style="margin:0 0 4px;font-size:20px;">Consulta tu avance</h2>
      <p style="color:var(--text-dim);font-size:13.5px;margin:0 0 18px;">Ingresa tu número de documento para ver tu progreso.</p>
      <input id="ccInput" inputmode="numeric" placeholder="Número de documento (CC)" style="margin-bottom:12px;">
      <button class="btn-lime" id="btnVer">Ver mi avance</button>
      <p class="err" id="errMsg"></p>
    </div>
    <p class="mono" style="text-align:center;font-size:10px;color:#4b5563;margin-top:40px;">&lt; THE ALL-SEEING EYE · CONSULTING ANALYTICS /&gt;</p>
  </div>

  <div id="resultBox" style="display:none;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://mzxyqkbhrcegiyqbbazp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_71sDgXwdaGSomzG2U24vkw_1N4JWhF-';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PLAT_LABEL = { excel:'Excel', powerbi:'Power BI' };
const platBadge = p => `<span class="badge-${p}">${PLAT_LABEL[p]}</span>`;
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

document.getElementById('ccInput').addEventListener('keydown', e=>{ if(e.key==='Enter') verAvance(); });
document.getElementById('btnVer').addEventListener('click', verAvance);

async function verAvance(){
  const cc = document.getElementById('ccInput').value.trim();
  const err = document.getElementById('errMsg');
  err.textContent = '';
  if(!cc){ err.textContent = 'Escribe tu número de documento.'; return; }

  const btn = document.getElementById('btnVer');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';

  const { data, error } = await sb.rpc('get_avance_estudiante', { p_documento: cc });

  btn.disabled = false; btn.textContent = 'Ver mi avance';

  if(error){ console.error(error); err.textContent = 'No pudimos consultar tu avance. Intenta de nuevo.'; return; }
  if(!data.ok){ err.textContent = data.error || 'Documento no encontrado.'; return; }

  renderAvance(data);
}

function ringSVG(pct){
  const r=52, c=2*Math.PI*r, off=c*(1-pct/100);
  return `<svg class="ring" width="150" height="150" viewBox="0 0 130 130">
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="12"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--lime)" stroke-width="12"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 65 65)"/>
    <text x="65" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="var(--lime)">${pct}%</text>
  </svg>`;
}

function renderAvance(a){
  document.getElementById('loginBox').style.display = 'none';
  const box = document.getElementById('resultBox');
  box.style.display = 'block';

  const plats = [...new Set(a.clases.map(c=>c.plataforma))];
  const total = a.clases.length;
  const vistas = a.clases.filter(c=>c.completed).length;
  const pct = total ? Math.round(vistas/total*100) : 0;

  const platCards = plats.map(p=>{
    const clasesPlat = a.clases.filter(c=>c.plataforma===p).sort((x,y)=>x.id-y.id);
    const vistasList = clasesPlat.filter(c=>c.completed);
    const pendientes = clasesPlat.filter(c=>!c.completed);
    const vistasHtml = vistasList.length ? vistasList.map(c=>`
      <div class="panel2" style="padding:12px 14px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
          <span class="lime">✓</span> ${platBadge(p)} <span style="font-weight:600;font-size:13.5px;">${esc(c.titulo)}</span>
        </div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">${esc(c.contenido||'')}</div>
      </div>`).join('') : '<div style="color:var(--text-dim);font-size:13px;">Aún no has visto clases en esta plataforma.</div>';

    const proxima = pendientes[0];
    const proxHtml = proxima ? `
      <div style="border:1px dashed rgba(197,255,61,.4);border-radius:16px;padding:14px;margin-top:12px;">
        <div class="mono lime" style="font-size:11px;margin-bottom:4px;">▶ PRÓXIMA CLASE</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">${platBadge(p)}<span style="font-weight:600;">${esc(proxima.titulo)}</span></div>
        <div style="font-size:12px;color:var(--text-dim);margin-top:4px;">${esc(proxima.contenido||'')}</div>
      </div>` : `<div class="lime" style="font-size:13px;margin-top:12px;">🎉 ¡Completaste todas las clases de ${PLAT_LABEL[p]}!</div>`;

    return `
      <div class="panel" style="padding:22px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <h3 style="margin:0;font-weight:600;">${PLAT_LABEL[p]}</h3>
          <span style="font-size:13px;color:var(--text-dim);">${vistasList.length}/${clasesPlat.length} vistas</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">${vistasHtml}</div>
        ${proxHtml}
      </div>`;
  }).join('');

  box.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <svg width="42" height="42" viewBox="0 0 100 100" style="filter:drop-shadow(0 0 8px rgba(197,255,61,.4));">
          <polygon points="50,12 88,80 12,80" fill="none" stroke="var(--lime)" stroke-width="3"/>
          <ellipse cx="50" cy="52" rx="16" ry="9" fill="none" stroke="#e8b33a" stroke-width="2.5"/>
          <circle cx="50" cy="52" r="5" fill="#e8b33a"/>
        </svg>
        <div><h1 class="brand" style="font-size:1.5rem;margin:0;">TASECA</h1><p style="color:var(--text-dim);font-size:12px;margin:2px 0 0;">${esc(a.nombre)}</p></div>
      </div>
      <button onclick="location.reload()" class="panel2" style="border:none;color:#e5e7eb;padding:9px 16px;border-radius:12px;cursor:pointer;font-size:13px;">Salir</button>
    </div>

    <div class="grid3">
      <div class="panel" style="padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        ${ringSVG(pct)}
        <div style="color:var(--text-dim);font-size:13px;margin-top:8px;">Avance general</div>
      </div>
      <div class="panel" style="padding:20px;display:flex;flex-direction:column;justify-content:center;">
        <div class="lime" style="font-size:34px;font-weight:800;">${vistas}</div>
        <div style="color:var(--text-dim);margin-top:4px;">Clases vistas</div>
      </div>
      <div class="panel" style="padding:20px;display:flex;flex-direction:column;justify-content:center;">
        <div style="font-size:34px;font-weight:800;">${total-vistas}</div>
        <div style="color:var(--text-dim);margin-top:4px;">Clases restantes</div>
      </div>
    </div>

    <div class="platcols" style="grid-template-columns:${plats.length>1?'1fr 1fr':'1fr'};">${platCards}</div>

    <p class="mono" style="text-align:center;font-size:10px;color:#4b5563;margin-top:32px;">&lt; THE ALL-SEEING EYE · CONSULTING ANALYTICS /&gt;</p>
  `;
}
</script>
</body>
</html>
